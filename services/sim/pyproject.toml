[project]
name = "pramana-sim"
version = "0.1.0"
description = "Simulated building with sealed hidden truth"
requires-python = ">=3.11"
dependencies = ["pramana-contracts", "pramana-domain", "fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic-settings>=2.6", "cryptography>=43"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pramana_sim"]
