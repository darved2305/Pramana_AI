name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pramana
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pramana_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pramana" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy packages/contracts/src packages/domain/src packages/engine/src services/sim/src services/core/src
      - name: Truth isolation (import contracts)
        run: uv run lint-imports
      - name: Contract schema and OpenAPI drift
        run: |
          uv run python -m pramana_contracts.export --check
          uv run python -m pramana_core.openapi_export --check
      - name: Tests (PostgreSQL, simulator in-process, Gnani protocol emulation)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://pramana@localhost:5433/pramana_test
        run: uv run pytest
