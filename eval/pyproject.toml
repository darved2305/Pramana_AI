[project]
name = "pramana-eval"
version = "0.1.0"
description = "Simulated participants and scenario runner"
requires-python = ">=3.11"
dependencies = ["pramana-contracts", "pramana-domain", "pramana-engine", "pramana-sim", "numpy>=1.26"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pramana_eval"]
