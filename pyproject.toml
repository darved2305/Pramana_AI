[project]
name = "pramana-workspace"
version = "0.1.0"
description = "Pramana: an AI that investigates physical faults it cannot see, by asking people"
requires-python = ">=3.11"
dependencies = [
    "pramana-contracts",
    "pramana-domain",
    "pramana-engine",
    "pramana-sim",
    "pramana-core",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-PyYAML>=6.0",
    "websockets>=14,<16",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/domain",
    "packages/engine",
    "services/sim",
    "services/core",
]

[tool.uv.sources]
pramana-contracts = { workspace = true }
pramana-domain = { workspace = true }
pramana-engine = { workspace = true }
pramana-sim = { workspace = true }
pramana-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web", "docs", "**/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Devanagari and typographic characters are intentional

[tool.ruff.lint.isort]
known-first-party = ["pramana_contracts", "pramana_domain", "pramana_engine", "pramana_sim", "pramana_core"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["N802", "PT011"]
"scripts/**" = ["ASYNC230", "ASYNC240", "ASYNC250"]  # CLI tools: blocking I/O is fine

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/contracts/src:packages/domain/src:packages/engine/src:services/sim/src:services/core/src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --import-mode=importlib"
pythonpath = ["packages/engine/tests", "services/core/tests", "tests"]
markers = [
    "db: requires the PostgreSQL test database (make db-up)",
    "live_gnani: calls the real Gnani API and spends credits (needs GNANI_API_KEY)",
]
testpaths = [
    "packages/contracts/tests",
    "packages/domain/tests",
    "packages/engine/tests",
    "services/sim/tests",
    "services/core/tests",
    "tests",
]

[tool.importlinter]
include_external_packages = true
root_packages = ["pramana_contracts", "pramana_domain", "pramana_engine", "pramana_sim", "pramana_core"]

[[tool.importlinter.contracts]]
name = "The engine and the core never import the simulator (hidden truth isolation)"
type = "forbidden"
source_modules = ["pramana_engine", "pramana_core", "pramana_domain", "pramana_contracts"]
forbidden_modules = ["pramana_sim"]

[[tool.importlinter.contracts]]
name = "The engine is pure: no web, database, or provider code"
type = "forbidden"
source_modules = ["pramana_engine"]
forbidden_modules = ["pramana_core", "fastapi", "sqlalchemy", "httpx", "websockets"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Contracts depend on nothing internal"
type = "forbidden"
source_modules = ["pramana_contracts"]
forbidden_modules = ["pramana_domain", "pramana_engine", "pramana_core"]
